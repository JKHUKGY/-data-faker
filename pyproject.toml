[project]
name = "ai_datafaker_pro"
description = "A catalog of realistic, business-meaningful synthetic datasets with generators, ER docs, and SQL queries for demos, analytics, and Text-to-SQL agent training."
version = "0.1.1"
requires-python = ">=3.12,<4.0"
dependencies = [
    "Faker>=40.1.2,<41.0.0",
    "polars>=1.36.1,<2.0.0",
    "SQLAlchemy>=2.0.46,<3.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pyarrow>=19.0.0,<20.0.0",
    "pandas>=2.2.0,<3.0.0",
    "fire>=0.7.1,<1.0.0",
    "claude-agent-sdk>=0.2.105,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_datafaker_pro*"]
exclude = [
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
